<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#6c83a3"/></marker></defs><rect width="1100" height="760" fill="#fff"/><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#203650} .title{font-size:24px;font-weight:600}.label{font-size:14px}.small{font-size:12px;fill:#5b708e}.line{stroke:#6c83a3;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style><text x="35" y="42" class="title" text-anchor="start">C1 模块和依赖</text><text x="35" y="74" class="small" text-anchor="start">单体部署、包边界；箭头表示调用或数据依赖，不表示微服务。</text><rect x="35" y="115" width="1030" height="85" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="50" y="141" class="label" text-anchor="start">M08 前端</text><text x="50" y="167" class="small" text-anchor="start">页面 / API client / 动态路由 / 按钮权限 / ETag / 统一错误</text><path d="M550 200 L550 245" class="line"/><text x="557.0" y="214.5" class="small" text-anchor="start">HTTP</text><rect x="35" y="250" width="1030" height="85" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="50" y="276" class="label" text-anchor="start">M00 API 与契约</text><text x="50" y="302" class="small" text-anchor="start">Controller / DTO / requestId / If-Match / ErrorHandler</text><path d="M150 335 L150 380" class="line"/><rect x="35" y="385" width="235" height="120" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="50" y="411" class="label" text-anchor="start">M01 身份安全门</text><text x="50" y="437" class="small" text-anchor="start">账号 / 会话 / authVersion</text><text x="50" y="459" class="small" text-anchor="start">sysId 上下文 / 每请求校验</text><rect x="300" y="385" width="500" height="120" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="315" y="411" class="label" text-anchor="start">M02 M03 M04 M05 业务事务脚本</text><text x="315" y="437" class="small" text-anchor="start">平台 / 成员 / 目录 / 授权差集</text><text x="315" y="459" class="small" text-anchor="start">system 锁 → 根版本 → 委派 → 审计</text><rect x="830" y="385" width="235" height="120" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="845" y="411" class="label" text-anchor="start">M06 权限求解</text><text x="845" y="437" class="small" text-anchor="start">系统内角色权限并集</text><text x="845" y="459" class="small" text-anchor="start">版本缓存 / 菜单投影</text><path d="M270 445 L300 445" class="line"/><path d="M800 445 L830 445" class="line"/><rect x="35" y="565" width="765" height="100" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="50" y="591" class="label" text-anchor="start">MySQL 权威状态 + M07 审计</text><text x="50" y="617" class="small" text-anchor="start">身份 / 成员 / 角色 / 权限 / 关联 / 会话 / 策略版本 / before-after</text><rect x="830" y="565" width="235" height="100" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="845" y="591" class="label" text-anchor="start">Redis 派生缓存</text><text x="845" y="617" class="small" text-anchor="start">key 含 sysId 与版本</text><text x="845" y="639" class="small" text-anchor="start">不可用回源主库</text><path d="M550 505 L550 565" class="line"/><path d="M945 505 L945 565" class="line"/><path d="M865 505 L760 565" class="line"/><text x="35" y="720" class="label" text-anchor="start">M09：迁移、测试、JaCoCo、部署与性能验证；本包仅覆盖RBAC0。</text></svg>