<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#6c83a3"/></marker></defs><rect width="1100" height="760" fill="#fff"/><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#203650} .title{font-size:24px;font-weight:600}.label{font-size:14px}.small{font-size:12px;fill:#5b708e}.line{stroke:#6c83a3;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style><text x="35" y="42" class="title" text-anchor="start">账号与会话状态</text><text x="35" y="75" class="small" text-anchor="start">账号业务状态与临时登录锁定分开保存；会话撤销和过期另行校验。</text><rect x="100" y="150" width="220" height="100" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="115" y="176" class="label" text-anchor="start">ENABLED</text><text x="115" y="202" class="small" text-anchor="start">正常账号，可继续安全门</text><rect x="760" y="150" width="240" height="100" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="775" y="176" class="label" text-anchor="start">DISABLED</text><text x="775" y="202" class="small" text-anchor="start">平台停用 / authVersion+1</text><path d="M320 185 L760 185" class="line"/><text x="547.0" y="177.0" class="small" text-anchor="start">平台管理员停用</text><path d="M760 225 L320 225" class="line"/><text x="547.0" y="217.0" class="small" text-anchor="start">平台重新启用 / authVersion+1</text><rect x="100" y="380" width="220" height="105" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="115" y="406" class="label" text-anchor="start">未锁定登录</text><text x="115" y="432" class="small" text-anchor="start">failed_attempts &lt; 5</text><rect x="760" y="380" width="240" height="105" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="775" y="406" class="label" text-anchor="start">临时锁定登录</text><text x="775" y="432" class="small" text-anchor="start">locked_until &gt; now</text><path d="M320 410 L760 410" class="line"/><text x="547.0" y="402.0" class="small" text-anchor="start">失败达到阈值，锁定15分钟</text><path d="M760 455 L320 455" class="line"/><text x="547.0" y="447.0" class="small" text-anchor="start">时间到期，允许重新验证凭据</text><rect x="100" y="600" width="220" height="95" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="115" y="626" class="label" text-anchor="start">ACTIVE 会话</text><text x="115" y="652" class="small" text-anchor="start">未过期 / 未撤销 / 版本一致</text><rect x="760" y="600" width="240" height="95" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="775" y="626" class="label" text-anchor="start">不可用会话</text><text x="775" y="652" class="small" text-anchor="start">登出、改密或过期</text><path d="M320 640 L760 640" class="line"/><text x="547.0" y="632.0" class="small" text-anchor="start">撤销 / 到期 / authVersion变化</text></svg>