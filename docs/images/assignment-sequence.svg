<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#6c83a3"/></marker></defs><rect width="1100" height="760" fill="#fff"/><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#203650} .title{font-size:24px;font-weight:600}.label{font-size:14px}.small{font-size:12px;fill:#5b708e}.line{stroke:#6c83a3;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style><text x="35" y="42" class="title" text-anchor="start">成员角色替换时序</text><text x="35" y="72" class="small" text-anchor="start">一次业务事务包含关联差集、两个版本及成功审计。</text><rect x="25" y="100" width="130" height="45" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="40" y="126" class="label" text-anchor="start">浏览器</text><path d="M90 145 V700" stroke="#bbc8da" stroke-dasharray="5 5"/><rect x="245" y="100" width="130" height="45" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="260" y="126" class="label" text-anchor="start">API / 安全门</text><path d="M310 145 V700" stroke="#bbc8da" stroke-dasharray="5 5"/><rect x="515" y="100" width="130" height="45" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="530" y="126" class="label" text-anchor="start">M05 授权脚本</text><path d="M580 145 V700" stroke="#bbc8da" stroke-dasharray="5 5"/><rect x="845" y="100" width="130" height="45" rx="8" fill="#f2f6fe" stroke="#9db5d9"/><text x="860" y="126" class="label" text-anchor="start">MySQL / 审计</text><path d="M910 145 V700" stroke="#bbc8da" stroke-dasharray="5 5"/><path d="M90 195 L310 195" class="line"/><text x="102" y="185" class="small" text-anchor="start">PUT roleIds + If-Match</text><path d="M310 255 L580 255" class="line"/><text x="322" y="245" class="small" text-anchor="start">可信上下文与已解析请求</text><path d="M580 315 L910 315" class="line"/><text x="592" y="305" class="small" text-anchor="start">BEGIN；锁 system → member</text><path d="M910 375 L580 375" class="line"/><text x="592" y="365" class="small" text-anchor="start">当前版本与操作者权限快照</text><path d="M580 435 L910 435" class="line"/><text x="592" y="425" class="small" text-anchor="start">同系统 / 委派 / 版本验证</text><path d="M580 495 L910 495" class="line"/><text x="592" y="485" class="small" text-anchor="start">写差集 + 根 version + policyVersion</text><path d="M580 555 L910 555" class="line"/><text x="592" y="545" class="small" text-anchor="start">INSERT audit before/after；COMMIT</text><path d="M580 615 L310 615" class="line"/><text x="322" y="605" class="small" text-anchor="start">最终集合与新 ETag</text><path d="M310 675 L90 675" class="line"/><text x="102" y="665" class="small" text-anchor="start">200 + requestId；失败则4xx且回滚</text></svg>