<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RBAC0 权限后端演示台</title>
  <style>
    :root { color-scheme: light; --bg:#f3f6fb; --card:#fff; --ink:#172033; --muted:#6b7485; --line:#dfe5ef; --brand:#2457e6; --brand2:#6d3ef1; --ok:#0e8a68; --warn:#b45309; --bad:#c62828; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; color:var(--ink); background:radial-gradient(circle at 10% 0%,#dce8ff 0,transparent 32%),radial-gradient(circle at 95% 8%,#ecddff 0,transparent 28%),var(--bg); min-height:100vh; }
    button,input,select { font:inherit; }
    .shell { max-width:1240px; margin:auto; padding:28px 22px 50px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:22px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .logo { width:44px; height:44px; border-radius:14px; color:#fff; background:linear-gradient(135deg,var(--brand),var(--brand2)); display:grid; place-items:center; font-weight:800; box-shadow:0 10px 24px #2457e640; }
    h1 { font-size:23px; margin:0; letter-spacing:-.4px; }
    .sub { color:var(--muted); font-size:13px; margin-top:3px; }
    .pill { border:1px solid var(--line); background:#ffffffcc; padding:8px 13px; border-radius:999px; color:var(--muted); font-size:13px; }
    .login { max-width:480px; margin:9vh auto; background:#fffffff2; border:1px solid #fff; box-shadow:0 30px 80px #24407b22; border-radius:26px; padding:34px; backdrop-filter:blur(12px); }
    .login h2 { margin:0 0 8px; font-size:30px; letter-spacing:-1px; }
    .login p { color:var(--muted); line-height:1.7; margin:0 0 24px; }
    .field { margin:15px 0; }
    label { display:block; font-size:13px; font-weight:650; margin-bottom:7px; }
    input,select { width:100%; border:1px solid var(--line); background:#f8faff; border-radius:12px; padding:12px 13px; outline:none; }
    input:focus,select:focus { border-color:#8aa8ff; box-shadow:0 0 0 4px #2457e615; background:#fff; }
    .hint { font-size:12px; color:var(--muted); margin-top:10px; line-height:1.6; }
    .btn { border:0; border-radius:12px; padding:11px 16px; font-weight:700; cursor:pointer; background:var(--brand); color:#fff; }
    .btn:hover { filter:brightness(1.05); }
    .btn.secondary { background:#edf2ff; color:#2449b8; }
    .btn.ghost { background:#fff; border:1px solid var(--line); color:var(--ink); }
    .btn.danger { background:#fff0f0; color:var(--bad); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .wide { width:100%; margin-top:8px; }
    .hidden { display:none !important; }
    .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .contexts { display:flex; background:#e8eef9; padding:4px; border-radius:13px; }
    .contexts button { border:0; background:transparent; border-radius:9px; padding:9px 14px; cursor:pointer; color:var(--muted); font-weight:650; }
    .contexts button.active { background:#fff; color:var(--brand); box-shadow:0 4px 12px #29406b18; }
    .grid { display:grid; grid-template-columns:1.02fr 1.1fr .88fr; gap:16px; }
    .card { background:#fffffff0; border:1px solid #fff; border-radius:20px; padding:20px; box-shadow:0 16px 44px #1d35620e; }
    .card h3 { margin:0 0 15px; font-size:16px; display:flex; justify-content:space-between; align-items:center; }
    .meta { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .stat { background:#f7f9fe; border:1px solid #e8edf7; border-radius:14px; padding:12px; }
    .stat small { display:block; color:var(--muted); margin-bottom:5px; }
    .stat strong { font-size:14px; word-break:break-all; }
    .codes { display:flex; flex-wrap:wrap; gap:7px; max-height:300px; overflow:auto; }
    .code { font-family:ui-monospace,Consolas,monospace; font-size:12px; padding:6px 9px; background:#eef3ff; color:#2547a6; border-radius:8px; }
    .menu { list-style:none; padding-left:0; margin:0; }
    .menu .menu { margin:7px 0 0 18px; border-left:1px dashed #cdd6e8; padding-left:12px; }
    .menu-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; border-radius:9px; background:#f8faff; margin:6px 0; }
    .menu-item small { color:var(--muted); }
    .tag { font-size:11px; padding:3px 7px; border-radius:99px; background:#e8f7f1; color:var(--ok); }
    .tag.container { background:#fff6e7; color:var(--warn); }
    .assignment { grid-column:1/3; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .role-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:9px; margin:14px 0; }
    .role { display:flex; gap:8px; align-items:center; padding:10px; border:1px solid var(--line); border-radius:11px; cursor:pointer; }
    .role input { width:16px; }
    .role span { font-size:13px; }
    .audit { grid-column:3; }
    .audit-item { border-top:1px solid var(--line); padding:10px 0; }
    .audit-item:first-child { border-top:0; }
    .audit-item b { font-size:13px; }
    .audit-item p { margin:5px 0 0; color:var(--muted); font-size:12px; line-height:1.5; word-break:break-all; }
    .toast { position:fixed; right:22px; bottom:22px; max-width:380px; background:#172033; color:#fff; padding:13px 16px; border-radius:12px; box-shadow:0 16px 40px #17203340; opacity:0; transform:translateY(12px); transition:.2s; pointer-events:none; }
    .toast.show { opacity:1; transform:none; }
    .error { color:var(--bad); font-size:13px; margin-top:10px; min-height:18px; }
    @media (max-width:900px) { .grid { grid-template-columns:1fr; } .assignment,.audit { grid-column:auto; } .topbar { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
<div class="shell">
  <section id="loginView" class="login">
    <div class="brand" style="margin-bottom:22px">
      <div class="logo">RB</div>
      <div><h1>RBAC0 权限后端演示台</h1><div class="sub">有效权限 · 菜单投影 · 统一鉴权</div></div>
    </div>
    <h2>进入演示环境</h2>
    <p>选择演示账号与业务系统。所有示例账号密码均为 <b>DemoOnly12345</b>，数据来自 H2 种子库。</p>
    <div class="field">
      <label for="username">演示账号</label>
      <select id="username">
        <option value="platform_admin">platform_admin · 平台管理员</option>
        <option value="system_admin">system_admin · 系统管理员</option>
        <option value="auditor">auditor · 审计员</option>
        <option value="chenyu">chenyu · 普通成员</option>
      </select>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" type="password" value="DemoOnly12345">
    </div>
    <div class="field">
      <label for="loginSys">业务系统</label>
      <select id="loginSys"><option value="1">系统 A · 教务管理</option><option value="2">系统 B · 科研管理</option></select>
    </div>
    <button id="loginBtn" class="btn wide">登录并计算权限</button>
    <div id="loginError" class="error"></div>
    <div class="hint">建议演示顺序：平台管理员进入系统 A；给陈雨指派“审计查看员”；重新以陈雨登录系统 A，观察菜单和权限码即时变化；再到系统 B 比较隔离结果。</div>
  </section>

  <main id="appView" class="hidden">
    <header class="topbar">
      <div class="brand">
        <div class="logo">RB</div>
        <div><h1>RBAC0 权限控制台</h1><div id="sessionSub" class="sub"></div></div>
      </div>
      <div class="toolbar">
        <div class="contexts" id="contexts"><button data-sys="1">系统 A</button><button data-sys="2">系统 B</button></div>
        <button class="btn ghost" id="refreshBtn">刷新</button>
        <button class="btn danger" id="logoutBtn">退出</button>
      </div>
    </header>

    <div class="grid">
      <section class="card">
        <h3>当前会话 <span class="tag">已认证</span></h3>
        <div id="identity" class="meta"></div>
        <h3 style="margin-top:20px">有效权限码</h3>
        <div id="codes" class="codes"></div>
      </section>

      <section class="card">
        <h3>动态菜单投影 <span class="tag" id="menuCount"></span></h3>
        <div id="menus"></div>
      </section>

      <section class="card audit">
        <h3>最近审计事件</h3>
        <div id="audit"></div>
      </section>

      <section class="card assignment">
        <h3>成员角色指派演示 <span class="tag" id="etagTag"></span></h3>
        <div class="row">
          <select id="memberSelect" style="max-width:260px"></select>
          <button class="btn secondary" id="loadRolesBtn">读取角色</button>
        </div>
        <div id="roleList" class="role-list"></div>
        <button class="btn" id="saveRolesBtn" disabled>保存并刷新有效权限</button>
        <div class="hint">保存使用 ETag 做乐观锁；成功后系统策略版本递增，新的权限缓存键立即生效。</div>
      </section>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
const state = { token: sessionStorage.getItem('rbacToken'), me: null, etag: null, sysId: null };
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(message) {
  const el = $('toast'); el.textContent = message; el.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove('show'), 2800);
}

async function api(path, options = {}) {
  const headers = new Headers(options.headers || {});
  headers.set('Accept', 'application/json');
  if (options.body) headers.set('Content-Type', 'application/json');
  if (state.token) headers.set('Authorization', `Bearer ${state.token}`);
  const response = await fetch(path, {...options, headers});
  let body = null;
  try { body = await response.json(); } catch (_) {}
  if (!response.ok) throw new Error(body?.message || `${response.status} ${response.statusText}`);
  return { body, headers: response.headers };
}

async function login() {
  $('loginError').textContent = '';
  $('loginBtn').disabled = true;
  try {
    const { body } = await api('/api/v1/auth/sessions', { method:'POST', body: JSON.stringify({
      username: $('username').value, password: $('password').value, sysId: $('loginSys').value
    })});
    state.token = body.data.accessToken;
    sessionStorage.setItem('rbacToken', state.token);
    await showApp();
  } catch (e) {
    $('loginError').textContent = e.message;
  } finally { $('loginBtn').disabled = false; }
}

async function showApp() {
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  await refresh();
}

async function refresh() {
  if (!state.token) return showLogin();
  try {
    const [{body: me}, {body: perms}, {body: menus}] = await Promise.all([
      api('/api/v1/me'), api('/api/v1/me/permissions'), api('/api/v1/me/menus')
    ]);
    state.me = me.data; state.sysId = me.data.sysId;
    $('sessionSub').textContent = `${me.data.displayName} · ${me.data.username} · 策略版本 ${me.data.policyVersion}`;
    $('identity').innerHTML = [
      ['用户 ID', me.data.userId], ['当前系统', me.data.sysId || '平台'], ['角色 ID', me.data.roleIds.join(', ') || '无'], ['权限数量', perms.data.permissionCodes.length]
    ].map(([k,v]) => `<div class="stat"><small>${esc(k)}</small><strong>${esc(v)}</strong></div>`).join('');
    $('codes').innerHTML = perms.data.permissionCodes.map(c => `<span class="code">${esc(c)}</span>`).join('') || '<span class="sub">当前系统没有有效权限</span>';
    $('menus').innerHTML = menus.data.length ? `<ul class="menu">${menus.data.map(renderMenu).join('')}</ul>` : '<div class="sub">无可见菜单</div>';
    $('menuCount').textContent = `${countMenus(menus.data)} 项`;
    document.querySelectorAll('#contexts button').forEach(btn => btn.classList.toggle('active', btn.dataset.sys === me.data.sysId));
    await Promise.all([loadMembers(perms.data.permissionCodes), loadAudit(perms.data.permissionCodes)]);
  } catch (e) {
    if (String(e.message).includes('401') || String(e.message).includes('会话')) showLogin();
    else toast(e.message);
  }
}

function renderMenu(item) {
  return `<li><div class="menu-item"><span>${esc(item.name)} ${item.navigable ? '<small>'+esc(item.routePath||'')+'</small>' : ''}</span><span class="tag ${item.navigable?'':'container'}">${item.navigable?'可导航':'容器'}</span></div>${item.children.length ? `<ul class="menu">${item.children.map(renderMenu).join('')}</ul>` : ''}</li>`;
}
function countMenus(items) { return items.reduce((sum, item) => sum + 1 + countMenus(item.children), 0); }

async function loadMembers(codes) {
  const canRead = codes.includes('sys:member:read');
  const canAssign = codes.includes('sys:member:assign');
  if (!canRead || !state.sysId) {
    $('memberSelect').innerHTML = '<option>当前账号无成员读取权限</option>';
    $('memberSelect').disabled = true; $('loadRolesBtn').disabled = true; $('saveRolesBtn').disabled = true;
    $('roleList').innerHTML = ''; $('etagTag').textContent = '';
    return;
  }
  const {body} = await api(`/api/v1/systems/${state.sysId}/members`);
  $('memberSelect').disabled = false; $('loadRolesBtn').disabled = !canAssign;
  $('memberSelect').innerHTML = body.data.map(m => `<option value="${esc(m.userId)}">${esc(m.displayName)} · ${esc(m.username)}</option>`).join('');
  const chenyu = body.data.find(m => m.username === 'chenyu');
  if (chenyu) $('memberSelect').value = chenyu.userId;
  if (canAssign) await loadRoles();
  else { $('roleList').innerHTML = ''; $('saveRolesBtn').disabled = true; $('etagTag').textContent = ''; }
}

async function loadRoles() {
  try {
    const userId = $('memberSelect').value;
    const {body, headers} = await api(`/api/v1/systems/${state.sysId}/members/${userId}/roles`);
    state.etag = headers.get('ETag');
    $('etagTag').textContent = state.etag || '无版本';
    $('roleList').innerHTML = body.data.options.map(role => `
      <label class="role" title="${esc(role.reason||'')}">
        <input type="checkbox" value="${esc(role.id)}" ${body.data.roleIds.includes(role.id)?'checked':''} ${role.assignable?'':'disabled'}>
        <span>${esc(role.name)}<br><small>${esc(role.code)} ${role.assignable?'':'· 不可指派'}</small></span>
      </label>`).join('');
    $('saveRolesBtn').disabled = false;
  } catch (e) { toast(e.message); }
}

async function saveRoles() {
  if (!state.etag) return;
  const roleIds = [...document.querySelectorAll('#roleList input:checked')].map(input => input.value);
  try {
    const userId = $('memberSelect').value;
    await api(`/api/v1/systems/${state.sysId}/members/${userId}/roles`, {
      method:'PUT', headers:{'If-Match':state.etag}, body:JSON.stringify({roleIds})
    });
    toast('角色已保存，策略版本已递增');
    await refresh();
  } catch (e) { toast(e.message); }
}

async function loadAudit(codes) {
  if (!state.sysId || !codes.includes('sys:audit:read')) {
    $('audit').innerHTML = '<div class="sub">当前账号无审计读取权限</div>'; return;
  }
  const {body} = await api(`/api/v1/systems/${state.sysId}/audit-logs?limit=6`);
  $('audit').innerHTML = body.data.length ? body.data.map(item => `<div class="audit-item"><b>${esc(item.action)}</b><p>${esc(item.actorName)} · ${new Date(item.createdAt).toLocaleString()}</p></div>`).join('') : '<div class="sub">暂无审计事件</div>';
}

async function switchContext(sysId) {
  try {
    const {body} = await api('/api/v1/auth/contexts', {method:'POST', body:JSON.stringify({sysId})});
    state.token = body.data.accessToken; sessionStorage.setItem('rbacToken', state.token);
    await refresh();
  } catch (e) { toast(e.message); }
}

function showLogin() {
  state.token = null; sessionStorage.removeItem('rbacToken');
  $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden');
}

$('loginBtn').addEventListener('click', login);
$('refreshBtn').addEventListener('click', refresh);
$('loadRolesBtn').addEventListener('click', loadRoles);
$('saveRolesBtn').addEventListener('click', saveRoles);
$('memberSelect').addEventListener('change', loadRoles);
$('logoutBtn').addEventListener('click', async () => {
  try { await api('/api/v1/auth/sessions/current', {method:'DELETE'}); } catch (_) {}
  showLogin();
});
document.querySelectorAll('#contexts button').forEach(btn => btn.addEventListener('click', () => switchContext(btn.dataset.sys)));
if (state.token) showApp(); else $('loginView').classList.remove('hidden');
</script>
</body>
</html>
