server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: rbac-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:rbac;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    serialization:
      write-dates-as-timestamps: false

rbac:
  session-minutes: ${SESSION_MINUTES:30}
  permission-cache-seconds: ${PERMISSION_CACHE_SECONDS:60}

logging:
  level:
    com.example.rbac: INFO
