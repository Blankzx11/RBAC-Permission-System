server:
  port: ${PORT:8080}
spring:
  application:
    name: rbac0-audit
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/rbac0?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:rbac_app}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 12
      connection-init-sql: SET time_zone = '+00:00'
  sql:
    init:
      mode: never
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
audit:
  node-id: ${AUDIT_NODE_ID:0}
logging:
  level:
    org.springframework.jdbc.core: INFO
